document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

r-neutral-200: #eee7db;\n  --color-neutral-300: #dcd3c4;\n  --color-neutral-400: #c0b6a5;\n  --color-neutral-500: #a19786;\n  --color-neutral-600: #82796a;\n  --color-neutral-700: #645c50;\n  --color-neutral-800: #474238;\n  --color-neutral-900: #2e2b25;\n\n  --color-accent-100: #fff2eb;\n  --color-accent-200: #ffe1d0;\n  --color-accent-300: #ffc6a5;\n  --color-accent-400: #f6a06b;\n  --color-accent-500: #d67f48;\n  --color-accent-600: #b2622d;\n  --color-accent-700: #8c491a;\n  --color-accent-800: #643312;\n  --color-accent-900: #402310;\n\n  --color-accent-2-100: #f0fae1;\n  --color-accent-2-200: #e1eecc;\n  --color-accent-2-300: #ccdbb2;\n  --color-accent-2-400: #aebf92;\n  --color-accent-2-500: #8fa073;\n  --color-accent-2-600: #728157;\n  --color-accent-2-700: #56633f;\n  --color-accent-2-800: #3d472b;\n  --color-accent-2-900: #272e1b;\n\n  --font-heading: \"Caprasimo\", system-ui, sans-serif;\n  --font-heading-weight: 400;\n  --font-body: \"Figtree\", system-ui, sans-serif;\n\n  --space-1: 4.4px;\n  --space-2: 8.8px;\n  --space-3: 13.2px;\n  --space-4: 17.6px;\n  --space-6: 26.4px;\n  --space-8: 35.2px;\n\n  --radius-sm: 8px;\n  --radius-md: 16px;\n  --radius-lg: 28px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2e2b25 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2e2b25 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2e2b25 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.washed{filter:saturate(0.6) contrast(0.85) brightness(1.1) opacity(0.94)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — rounded frame: everything softens, small controls go pill — */\n.card, .dialog { border-radius: calc(var(--radius-lg) * 1.15); }\n.btn, .tag, .seg, .input { border-radius: como el primer día.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"background:var(--color-neutral-900);color:var(--color-neutral-100);border-radius:48px;max-width:1240px;margin:0 auto;padding:72px 0\">\n    <div style=\"max-width:1200px;margin:0 auto;padding:0 28px\">\n      <h6 style=\"color:var(--color-accent-400);font-family:var(--font-body);font-weight:700;margin-bottom:12px\">Cómo funciona<\u002Fh6>\n      <h2 style=\"font-size:clamp(34px, 5vw, 52px);margin:0 0 40px\">Así de simple<\u002Fh2>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit, minmax(min(100%, 240px), 1fr));gap:28px\">\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <span style=\"width:60px;height:60px;border-radius:50%;background:var(--color-accent);color:var(--color-neutral-900);display:grid;place-items:center;font-family:var(--font-heading);font-size:26px\">1<\u002Fspan>\n          <h3 style=\"font-size:22px;margin:6px 0 0\">Trae o envía tu receta<\u002Fh3>\n          <p style=\"margin:0;color:var(--color-neutral-300);font-size:16px\">En el local o por WhatsApp, como te acomode.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <span style=\"width:60px;height:60px;border-radius:50%;background:var(--color-accent-2-400);color:var(--color-neutral-900);display:grid;place-items:center;font-family:var(--font-heading);font-size:26px\">2<\u002Fspan>\n          <h3 style=\"font-size:22px;margin:6px 0 0\">Te asesoramos con cristales y montura<\u002Fh3>\n          <p style=\"margin:0;color:var(--color-neutral-300);font-size:16px\">Te explicamos tus opciones, sin enredos.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <span style=\"width:60px;height:60px;border-radius:50%;background:var(--color-accent);color:var(--color-neutral-900);display:grid;place-items:center;font-family:var(--font-heading);font-size:26px\">3<\u002Fspan>\n          <h3 style=\"font-size:22px;margin:6px 0 0\">Fabricamos tus lentes<\u002Fh3>\n          <p style=\"margin:0;color:var(--color-neutral-300);font-size:16px\">Con precisión, según cada dato de tu receta.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <span style=\"width:60px;height:60px;border-radius:50%;background:var(--color-accent-2-400);color:var(--color-neutral-900);display:grid;place-items:center;font-family:var(--font-heading);font-size:26px\">4<\u002Fspan>\n          <h3 style=\"font-size:22px;margin:6px 0 0\">Retiras y ajustamos a tu medida<\u002Fh3>\n          <p style=\"margin:0;color:var(--color-neutral-300);font-size:16px\">Los dejamos cómodos en tu rostro antes de que te vayas.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"max-width:1200px;margin:0 auto;padding:80px 20px\">\n    <div style=\"position:relative;overflow:hidden;background:var(--color-accent-200);border-radius:40px;padding:56px 36px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:28px\">\n      <div style=\"position:absolute;width:260px;height:260px;border-radius:50%;background:var(--color-accent-300);right:-60px;top:-90px\"><\u002Fdiv>\n      <div style=\"position:relative;max-width:32em\">\n        <h2 style=\"font-size:clamp(30px, 4.5vw, 46px);margin:0 0 10px;color:var(--color-accent-900)\">¿Listo para ver mejor?<\u002Fh2>\n        <p style=\"font-size:18px;margin:0;color:var(--color-accent-900)\">Cuéntanos qué necesitas y te enviamos tu cotización.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"position:relative;display:flex;flex-wrap:wrap;gap:12px\">\n        <a href=\"#contacto\" sc-camel-on-click=\"{{ go.contacto }}\" class=\"btn btn-primary\" style=\"padding:15px 26px;font-size:17px;background:var(--color-neutral-900);color:var(--color-neutral-100)\">Cotiza tus lentes<\u002Fa>\n        <a href=\"{{ waHref }}\" target=\"_blank\" rel=\"noopener\" class=\"btn btn-secondary\" style=\"padding:15px 22px;font-size:17px;color:var(--color-accent-900);border-color:var(--color-accent-700)\">Escríbenos por WhatsApp<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ is.lentes }}\" hint-placeholder-val=\"{{ false }}\">\n  <section data-screen-label=\"Lentes\" style=\"max-width:1240px;margin:24px auto 0;padding:0 20px\">\n    <div style=\"position:relative;overflow:hidden;background:var(--color-neutral-900);color:var(--color-neutral-100);border-radius:44px;padding:64px 32px\">\n      <div style=\"position:absolute;width:280px;height:280px;border-radius:50%;background:var(--color-accent-700);right:-80px;bottom:-120px\"><\u002Fdiv>\n      <div style=\"position:relative;max-width:38em\">\n        <h6 style=\"color:var(--color-accent-400);font-family:var(--font-body);font-weight:700;margin-bottom:12px\">Lentes<\u002Fh6>\n        <h1 style=\"font-size:clamp(40px, 6vw, 64px);margin:0 0 14px;line-height:1.02\">Cristales pensados para tu forma de ver<\u002Fh1>\n        <p style=\"font-size:18px;margin:0;color:var(--color-neutral-300)\">Te ayudamos a elegir según tu receta, tu rutina y lo que quieres sentir al usarlos.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <section style=\"max-width:1200px;margin:0 auto;padding:56px 20px 40px;display:grid;grid-template-columns:repeat(auto-fill, minmax(min(100%, 340px), 1fr));gap:20px\">\n    <div class=\"card\" style=\"padding:32px;gap:14px\">\n      <span class=\"card-kicker\" style=\"font-size:12px;color:var(--color-accent-700)\">Visión simple<\u002Fspan>\n      <div class=\"card-title\" style=\"font-size:26px\">Lentes monofocales<\u002Fdiv>\n      <p class=\"card-body\" style=\"font-size:16px;flex:0\">Una sola graduación para ver bien de lejos o de cerca.<\u002Fp>\n      <ul style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:15px\">\n        <li style=\"display:flex;gap:10px\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-accent-2-700)\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>Para lejos o para lectura<\u002Fli>\n        <li style=\"display:flex;gap:10px\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-accent-2-700)\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>Asesoría en cristal y montura<\u002Fli>\n        <li style=\"display:flex;gap:10px\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-accent-2-700)\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>Ajuste final a tu medida<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div class=\"card\" style=\"padding:32px;gap:14px\">\n      <span class=\"card-kicker\" style=\"font-size:12px;color:var(--color-accent-700)\">Todas las distancias<\u002Fspan>\n      <div class=\"card-title\" style=\"font-size:26px\">Multifocales / progresivos<\u002Fdiv>\n      <p class=\"card-body\" style=\"font-size:16px;flex:0\">Lejos, intermedio y cerca en un mismo par, sin cambiar de lentes.<\u002Fp>\n      <ul style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:15px\">\n        <li style=\"display:flex;gap:10px\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-accent-2-700)\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>Toma de medidas personalizada<\u002Fli>\n        <li style=\"display:flex;gap:10px\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-accent-2-700)\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>Orientación para la adaptación<\u002Fli>\n        <li style=\"display:flex;gap:10px\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-accent-2-700)\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>Control posterior a la entrega<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div class=\"card\" style=\"padding:32px;gap:14px\">\n      <span class=\"card-kicker\" style=\"font-size:12px;color:var(--color-accent-700)\">Protección y confort<\u002Fspan>\n      <div class=\"card-title\" style=\"font-size:26px\">Tratamientos<\u002Fdiv>\n      <p class=\"card-body\" style=\"font-size:16px;flex:0\">Mejoras para que tus cristales rindan más en tu día a día.<\u002Fp>\n      <ul style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:15px\">\n        <li style=\"display:flex;gap:10px\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-accent-2-700)\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>Antirreflejo<\u002Fli>\n        <li style=\"display:flex;gap:10px\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-accent-2-700)\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>Filtro de luz azul<\u002Fli>\n        <li style=\"display:flex;gap:10px\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-accent-2-700)\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>Fotocromáticos<\u002Fli>\n        <li style=\"display:flex;gap:10px\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-accent-2-700)\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>Endurecido<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div class=\"card\" style=\"padding:32px;gap:14px\">\n      <span class=\"card-kicker\" style=\"font-size:12px;color:var(--color-accent-700)\">Recetas altas<\u002Fspan>\n      <div class=\"card-title\" style=\"font-size:26px\">Cristales delgados de alto índice<\u002Fdiv>\n      <p class=\"card-body\" style=\"font-size:16px;flex:0\">Más livianos y estéticos cuando tu graduación es alta.<\u002Fp>\n      <ul style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:15px\">\n        <li style=\"display:flex;gap:10px\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-accent-2-700)\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>Menor grosor en el borde<\u002Fli>\n        <li style=\"display:flex;gap:10px\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-accent-2-700)\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>Más livianos al usar<\u002Fli>\n        <li style=\"display:flex;gap:10px\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-accent-2-700)\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>Más opciones de montura<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div class=\"card\" style=\"padding:32px;gap:14px\">\n      <span class=\"card-kicker\" style=\"font-size:12px;color:var(--color-accent-700)\">Sin montura<\u002Fspan>\n      <div class=\"card-title\" style=\"font-size:26px\">Lentes de contacto<\u002Fdiv>\n      <p class=\"card-body\" style=\"font-size:16px;flex:0\">Te enseñamos a usarlos y cuidarlos, paso a paso.<\u002Fp>\n      <ul style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:15px\">\n        <li style=\"display:flex;gap:10px\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-accent-2-700)\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>Adaptación guiada<\u002Fli>\n        <li style=\"display:flex;gap:10px\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-accent-2-700)\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>Instrucciones de uso y cuidado<\u002Fli>\n        <li style=\"display:flex;gap:10px\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-accent-2-700)\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>Controles de seguimiento<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div class=\"card\" style=\"padding:32px;gap:14px\">\n      <span class=\"card-kicker\" style=\"font-size:12px;color:var(--color-accent-700)\">Para el exterior<\u002Fspan>\n      <div class=\"card-title\" style=\"font-size:26px\">Lentes de sol<\u002Fdiv>\n      <p class=\"card-body\" style=\"font-size:16px;flex:0\">Con o sin receta, para cuidar tus ojos con estilo.<\u002Fp>\n      <ul style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:15px\">\n        <li style=\"display:flex;gap:10px\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-accent-2-700)\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>Protección contra rayos UV<\u002Fli>\n        <li style=\"display:flex;gap:10px\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-accent-2-700)\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>Opción con tu graduación<\u002Fli>\n        <li style=\"display:flex;gap:10px\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-accent-2-700)\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>Asesoría según tu rostro<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <section style=\"max-width:1200px;margin:0 auto;padding:24px 20px 80px\">\n    <div style=\"background:var(--color-accent-2-200);border-radius:40px;padding:48px 36px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:24px\">\n      <div style=\"max-width:32em\">\n        <h2 style=\"font-size:clamp(28px, 4vw, 40px);margin:0 0 8px;color:var(--color-accent-2-900)\">¿Tienes dudas con tu receta?<\u002Fh2>\n        <p style=\"font-size:17px;margin:0;color:var(--color-accent-2-900)\">Mándanos una foto y te orientamos sobre qué lentes te convienen.<\u002Fp>\n      <\u002Fdiv>\n      <a href=\"{{ waReceta }}\" target=\"_blank\" rel=\"noopener\" class=\"btn btn-primary\" style=\"padding:15px 24px;font-size:17px;background:var(--color-accent-2-800);color:var(--color-accent-2-100)\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M7.9 20A9 9 0 1 0 4 16.1L2 22Z\"><\u002Fpath><\u002Fsvg>Consultar por WhatsApp<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ is.monturas }}\" hint-placeholder-val=\"{{ false }}\">\n  <section data-screen-label=\"Monturas\" style=\"max-width:1240px;margin:24px auto 0;padding:0 20px\">\n    <div style=\"position:relative;overflow:hidden;background:var(--color-neutral-900);color:var(--color-neutral-100);border-radius:44px;padding:64px 32px\">\n      <div style=\"position:absolute;width:280px;height:280px;border-radius:50%;background:var(--color-accent-2-700);right:-80px;top:-120px\"><\u002Fdiv>\n      <div style=\"position:relative;max-width:38em\">\n        <h6 style=\"color:var(--color-accent-400);font-family:var(--font-body);font-weight:700;margin-bottom:12px\">Monturas<\u002Fh6>\n        <h1 style=\"font-size:clamp(40px, 6vw, 64px);margin:0 0 14px;line-height:1.02\">Encuentra la que va contigo<\u002Fh1>\n        <p style=\"font-size:18px;margin:0;color:var(--color-neutral-300)\">Ven a probártelas o pide fotos por WhatsApp.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <section style=\"max-width:1200px;margin:0 auto;padding:40px 20px 80px\">\n    <div style=\"display:flex;flex-wrap:wrap;gap:10px;margin-bottom:28px\">\n      <sc-for list=\"{{ filters }}\" as=\"f\" hint-placeholder-count=\"5\">\n        <button class=\"{{ f.cls }}\" sc-camel-on-click=\"{{ f.pick }}\" style=\"padding:11px 20px;font-size:15px\">{{ f.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fill, minmax(min(100%, 240px), 1fr));gap:18px\">\n      <sc-for list=\"{{ frames }}\" as=\"m\" hint-placeholder-count=\"8\">\n        <div class=\"card\" style=\"padding:12px;gap:10px\">\n          <div class=\"washed\" style=\"aspect-ratio:4/3;border-radius:24px;overflow:hidden;background:var(--color-neutral-200)\">\n            <image-slot id=\"montura-{{ m.id }}\" shape=\"rect\" placeholder=\"Foto de montura · {{ m.cat }}\"><\u002Fimage-slot>\n          <\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;align-items:center;padding:2px 8px 6px\">\n            <span class=\"card-title\">{{ m.label }}<\u002Fspan>\n            <span class=\"{{ m.tag }}\">{{ m.cat }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"margin-top:40px;display:flex;flex-wrap:wrap;align-items:center;gap:16px\">\n      <p style=\"margin:0;font-size:18px;font-family:var(--font-heading)\">¿Te gustó alguna? Pide más fotos o reserva tu visita.<\u002Fp>\n      <a href=\"{{ waFotos }}\" target=\"_blank\" rel=\"noopener\" class=\"btn btn-primary\" style=\"padding:13px 22px;font-size:16px;color:var(--color-bg)\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M7.9 20A9 9 0 1 0 4 16.1L2 22Z\"><\u002Fpath><\u002Fsvg>Pedir fotos por WhatsApp<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ is.convenios }}\" hint-placeholder-val=\"{{ false }}\">\n  <section data-screen-label=\"Convenios\" style=\"max-width:1240px;margin:24px auto 0;padding:0 20px\">\n    <div style=\"position:relative;overflow:hidden;background:var(--color-neutral-900);color:var(--color-neutral-100);border-radius:44px;padding:64px 32px\">\n      <div style=\"position:absolute;width:280px;height:280px;border-radius:50%;background:var(--color-accent-700);left:60%;bottom:-160px\"><\u002Fdiv>\n      <div style=\"position:relative;max-width:38em\">\n        <h6 style=\"color:var(--color-accent-400);font-family:var(--font-body);font-weight:700;margin-bottom:12px\">Convenios<\u002Fh6>\n        <h1 style=\"font-size:clamp(40px, 6vw, 64px);margin:0 0 14px;line-height:1.02\">Buena visión para todo tu equipo<\u002Fh1>\n        <p style=\"font-size:18px;margin:0 0 26px;color:var(--color-neutral-300)\">Convenios para empresas, cajas de compensación, colegios e instituciones.<\u002Fp>\n        <a href=\"#contacto\" sc-camel-on-clic lass=\"card\" style=\"padding:30px;gap:12px\">\n        <span style=\"width:52px;height:52px;border-radius:50%;background:var(--color-accent-2-200);color:var(--color-accent-2-800);display:grid;place-items:center\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"20\" height=\"14\" x=\"2\" y=\"5\" rx=\"2\"><\u002Frect><path d=\"M2 10h20\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <div class=\"card-title\" style=\"font-size:22px\">Facilidades de pago<\u002Fdiv>\n        <p class=\"card-body\" style=\"font-size:15px\">Condiciones pensadas para que cuidar la vista sea más fácil.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\" style=\"padding:30px;gap:12px\">\n        <span style=\"width:52px;height:52px;border-radius:50%;background:var(--color-accent-200);color:var(--color-accent-800);display:grid;place-items:center\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z\"><\u002Fpath><path d=\"M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2M10 6h4M10 10h4M10 14h4M10 18h4\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <div class=\"card-title\" style=\"font-size:22px\">Operativos en la empresa<\u002Fdiv>\n        <p class=\"card-body\" style=\"font-size:15px\">Vamos a tu lugar de trabajo para atender a tu equipo.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <section style=\"max-width:1200px;margin:0 auto;padding:56px 20px 80px\">\n    <h2 style=\"font-size:clamp(30px, 4.5vw, 44px);margin:0 0 28px\">Promociones vigentes<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit, minmax(min(100%, 340px), 1fr));gap:20px\">\n      <div style=\"position:relative;overflow:hidden;background:var(--color-accent-200);border-radius:36px;padding:34px;display:flex;flex-direction:column;gap:12px;align-items:flex-start\">\n        <div style=\"position:absolute;width:160px;height:160px;border-radius:50%;background:var(--color-accent-300);right:-40px;bottom:-60px\"><\u002Fdiv>\n        <span class=\"tag tag-outline\" style=\"font-size:12px;color:var(--color-accent-800);border-color:var(--color-accent-800)\">Ejemplo<\u002Fspan>\n        <h3 style=\"font-size:26px;margin:0;color:var(--color-accent-900)\">Segundo par para lectura<\u002Fh3>\n        <p style=\"margin:0;font-size:16px;color:var(--color-accent-900);position:relative\">Descripción breve de la promoción y sus condiciones generales.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"position:relative;overflow:hidden;background:var(--color-accent-2-200);border-radius:36px;padding:34px;display:flex;flex-direction:column;gap:12px;align-items:flex-start\">\n        <div style=\"position:absolute;width:160px;height:160px;border-radius:50%;background:var(--color-accent-2-300);right:-40px;bottom:-60px\"><\u002Fdiv>\n        <span class=\"tag tag-outline\" style=\"font-size:12px;color:var(--color-accent-2-800);border-color:var(--color-accent-2-800)\">Ejemplo<\u002Fspan>\n        <h3 style=\"font-size:26px;margin:0;color:var(--color-accent-2-900)\">Tratamiento antirreflejo incluido<\u002Fh3>\n        <p style=\"margin:0;font-size:16px;color:var(--color-accent-2-900);position:relative\">Descripción breve de la promoción y sus condiciones generales.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ is.nosotros }}\" hint-placeholder-val=\"{{ false }}\">\n  <section data-screen-label=\"Nosotros\" style=\"max-width:1240px;margin:24px auto 0;padding:0 20px\">\n    <div style=\"position:relative;overflow:hidden;background:var(--color-neutral-900);color:var(--color-neutral-100);border-radius:44px;padding:64px 32px\">\n      <div style=\"position:absolute;width:280px;height:280px;border-radius:50%;background:var(--color-accent-700);right:-80px;top:-120px\"><\u002Fdiv>\n      <div style=\"position:relative;max-width:38em\">\n        <h6 style=\"color:var(--color-accent-400);font-family:var(--font-body);font-weight:700;margin-bottom:12px\">Nosotros<\u002Fh6>\n        <h1 style=\"font-size:clamp(40px, 6vw, 64px);margin:0 0 14px;line-height:1.02\">Una óptica de barrio, con estándar de especialista<\u002Fh1>\n        <p style=\"font-size:18px;margin:0;color:var(--color-neutral-300)\">Asesoría personalizada y cristales de calidad, para que salgas viendo bien.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <section style=\"max-width:1200px;margin:0 auto;padding:64px 20px;display:grid;grid-template-columns:repeat(auto-fit, minmax(min(100%, 420px), 1fr));gap:40px;align-items:center\">\n    <div style=\"display:flex;flex-direction:column;gap:16px\">\n      <h2 style=\"font-size:clamp(30px, 4.5vw, 44px);margin:0\">Nuestra historia<\u002Fh2>\n      <p style=\"font-size:17px;margin:0;color:var(--color-neutral-800);text-wrap:pretty\">[Historia breve de la óptica: cómo nació, quiénes la atienden y qué la hace distinta.] Creemos que unos buenos lentes parten por escuchar: cómo trabajas, cuánto lees, si manejas de noche o pasas el día frente a una pantalla.<\u002Fp>\n      <p style=\"font-size:17px;margin:0;color:var(--color-neutral-800);text-wrap:pretty\">Por eso te explicamos cada opción con calma y cuidamos que tus cristales queden exactos a tu receta.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1.3fr 1fr;gap:14px\">\n      <div class=\"washed\" style=\"aspect-ratio:3/4;border-radius:36px;overflow:hidden;background:var(--color-surface)\"><image-slot id=\"nosotros-local\" shape=\"rect\" placeholder=\"Foto del local\"><\u002Fimage-slot><\u002Fdiv>\n      <div class=\"washed\" style=\"aspect-ratio:3/4;border-radius:999px;overflow:hidden;background:var(--color-surface);margin-top:48px\"><image-slot id=\"nosotros-equipo\" shape=\"rect\" placeholder=\"Foto del equipo\"><\u002Fimage-slot><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <section style=\"max-width:1200px;margin:0 auto;padding:16px 20px 80px\">\n    <h2 style=\"font-size:clamp(30px, 4.5vw, 44px);margin:0 0 28px\">Lo que nos mueve<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit, minmax(min(100%, 250px), 1fr));gap:18px\">\n      <div class=\"card\" style=\"padding:28px;gap:12px\">\n        <span style=\"width:52px;height:52px;border-radius:50%;background:var(--color-accent-200);color:var(--color-accent-800);display:grid;place-items:center\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M7.9 20A9 9 0 1 0 4 16.1L2 22Z\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <div class=\"card-title\" style=\"font-size:21px\">Asesoría honesta<\u002Fdiv>\n        <p class=\"card-body\" style=\"font-size:15px\">Te recomendamos lo que de verdad necesitas.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\" style=\"padding:28px;gap:12px\">\n        <span style=\"width:52px;height:52px;border-radius:50%;background:var(--color-accent-2-200);color:var(--color-accent-2-800);display:grid;place-items:center\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><circle cx=\"12\" cy=\"12\" r=\"6\"><\u002Fcircle><circle cx=\"12\" cy=\"12\" r=\"2\"><\u002Fcircle><\u002Fsvg><\u002Fspan>\n        <div class=\"card-title\" style=\"font-size:21px\">Precisión en cada receta<\u002Fdiv>\n        <p class=\"card-body\" style=\"font-size:15px\">Revisamos cada medida antes de fabricar.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\" style=\"padding:28px;gap:12px\">\n        <span style=\"width:52px;height:52px;border-radius:50%;background:var(--color-accent-200);color:var(--color-accent-800);display:grid;place-items:center\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.050 3 5.5l7 7Z\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <div class=\"card-title\" style=\"font-size:21px\">Atención cercana<\u002Fdiv>\n        <p class=\"card-body\" style=\"font-size:15px\">Te conocemos por tu nombre, no por tu boleta.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\" style=\"padding:28px;gap:12px\">\n        <span style=\"width:52px;height:52px;border-radius:50%;background:var(--color-accent-2-200);color:var(--color-accent-2-800);display:grid;place-items:center\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z\"><\u002Fpath><path d=\"m9 12 2 2 4-4\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <div class=\"card-title\" style=\"font-size:21px\">Garantía en nuestro trabajo<\u002Fdiv>\n        <p class=\"card-body\" style=\"font-size:15px\">Si algo no queda bien, lo resolvemos.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ is.contacto }}\" hint-placeholder-val=\"{{ false }}\">\n  <section data-screen-label=\"Contacto\" style=\"max-width:1200px;margin:0 auto;padding:48px 20px 24px\">\n    <h6 style=\"color:var(--color-accent-700);font-family:var(--font-body);font-weight:700;margin-bottom:12px\">Contacto<\u002Fh6>\n    <h1 style=\"font-size:clamp(44px, 7vw, 72px);margin:0 0 12px;line-height:1\">Cotiza tus lentes<\u002Fh1>\n    <p style=\"font-size:18px;margin:0;max-width:34em;color:var(--color-neutral-800)\">Completa el formulario y te respondemos con tu cotización. Si tienes tu receta a mano, adjúntala.<\u002Fp>\n  <\u002Fsection>\n  <section style=\"max-width:1200px;margin:0 auto;padding:24px 20px 56px;display:grid;grid-template-columns:repeat(auto-fit, minmax(min(100%, 420px), 1fr));gap:24px;align-items:start\">\n    <div class=\"card elev-md\" style=\"padding:32px;gap:16px;background:var(--color-neutral-100)\">\n      <sc-if value=\"{{ notSent }}\" hint-placeholder-val=\"{{ true }}\">\n        <form sc-camel-on-submit=\"{{ onSubmit }}\" style=\"display:flex;flex-direction:column;gap:16px\">\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit, minmax(min(100%, 200px), 1fr));gap:16px\">\n            <div class=\"field\"><label for=\"f-nombre\" style=\"font-size:14px\">Nombre<\u002Flabel><input id=\"f-nombre\" name=\"nombre\" class=\"input\" required=\"\" placeholder=\"Tu nombre\" style=\"min-height:48px;font-size:16px\"><\u002Fdiv>\n            <div class=\"field\"><label for=\"f-tel\" style=\"font-size:14px\">Teléfono<\u002Flabel><input id=\"f-tel\" name=\"telefono\" type=\"tel\" class=\"input\" required=\"\" placeholder=\"+56 9 1234 5678\" style=\"min-height:48px;font-size:16px\"><\u002Fdiv>\n            <div class=\"field\"><label for=\"f-mail\" style=\"font-size:14px\">Correo<\u002Flabel><input id=\"f-mail\" name=\"correo\" type=\"email\" class=\"input\" placeholder=\"tu@correo.cl\" style=\"min-height:48px;font-size:16px\"><\u002Fdiv>\n            <div class=\"field\"><label for=\"f-comuna\" style=\"font-size:14px\">Comuna<\u002Flabel><input id=\"f-comuna\" name=\"comuna\" class=\"input\" placeholder=\"Tu comuna\" style=\"min-height:48px;font-size:16px\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"field\"><label for=\"f-need\" style=\"font-size:14px\">¿Qué necesitas?<\u002Flabel>\n            <sc-raw-select id=\"f-need\" name=\"necesidad\" class=\"input\" sc-camel-default-value=\"{{ preset }}\" style=\"min-height:48px;font-size:16px\">\n              <option>Lentes ópticos<\u002Foption><option>Multifocales<\u002Foption><option>Lentes de contacto<\u002Foption><option>Lentes de sol<\u002Foption><option>Convenio empresa<\u002Foption><option>Otro<\u002Foption>\n            <\u002Fsc-raw-select>\n          <\u002Fdiv>\n          <div class=\"field\"><span style=\"display:block;font-size:14px;margin-bottom:5px;color:var(--color-neutral-700)\">Foto de tu receta (opcional)<\u002Fspan>\n            <label style=\"display:flex;align-items:center;gap:12px;cursor:pointer;padding:14px 18px;border:2px dashed var(--color-neutral-400);border-radius:24px;background:var(--color-surface);font-size:15px\">\n              <span style=\"width:40px;height:40px;flex:none;border-radius:50%;background:var(--color-accent-200);color:var(--color-accent-800);display:grid;place-items:center\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n              <span style=\"overflow:hidden;text-overflow:ellipsis\">{{ fileLabel }}<\u002Fspan>\n              <input type=\"file\" name=\"receta\" accept=\"image/*,.pdf\" sc-camel-on-change=\"{{ onFile }}\" style=\"position:absolute;opacity:0;width:1px;height:1px\">\n            <\u002Flabel>\n          <\u002Fdiv>\n          <div class=\"field\"><label for=\"f-msg\" style=\"font-size:14px\">Mensaje<\u002Flabel><textarea id=\"f-msg\" name=\"mensaje\" class=\"input\" placeholder=\"Cuéntanos qué buscas\" style=\"font-size:16px;border-radius:24px;padding:12px 16px;min-height:110px\"><\u002Ftextarea><\u002Fdiv>\n          <button type=\"submit\" class=\"btn btn-primary\" style=\"padding:16px pan style=\"font-weight:700;font-size:15px;padding-right:14px\">Escríbenos<\u002Fspan><\u002Fsc-if>\n  <\u002Fa>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;whatsapp&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;+56 9 4508 0845&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;WhatsApp&quot;},&quot;showWhatsapp&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;WhatsApp&quot;},&quot;heroMode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Foto&quot;,&quot;Video&quot;],&quot;default&quot;:&quot;Foto&quot;,&quot;tsType&quot;:&quot;'Foto'|'Video'&quot;,&quot;section&quot;:&quot;Portada&quot;},&quot;heroVideoUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Portada&quot;}}\">\nclass Component extends DCLogic {\n  state = { page: 'inicio', menu: false, mobile: false, filter: 'Todas', faq: -1, sent: null, file: '', preset: 'Lentes ópticos' };\n  pages = ['inicio', 'lentes', 'monturas', 'convenios', 'nosotros', 'contacto'];\n  componentDidMount() {\n    this.onHash = () => { const h = (location.hash || '').slice(1); if (this.pages.includes(h)) this.setState({ page: h, menu: false }); };\n    this.onResize = () => { const m = window.innerWidth < 960; if (m !== this.state.mobile) this.setState({ mobile: m, menu: false }); };\n    this.onHash(); this.onResize();\n    window.addEventListener('hashchange', this.onHash);\n    window.addEventListener('resize', this.onResize);\n  }\n  componentWillUnmount() {\n    window.removeEventListener('hashchange', this.onHash);\n    window.removeEventListener('resize', this.onResize);\n  }\n  nav(p, extra) {\n    return (e) => {\n      if (e) e.preventDefault();\n      try { history.replaceState(null, '', '#' + p); } catch (_) {}\n      this.setState({ page: p, menu: false, ...(extra || {}) });\n      window.scrollTo(0, 0);\n    };\n  }\n  wa(text) {\n    const digits = String(this.props.whatsapp ?? '+56 9 4508 0845').replace(/\\D/g, '');\n    return `https://wa.me/${digits}?text=${encodeURIComponent(text)}`;\n  }\n  renderVals() {\n    const s = this.state;\n    const go = {}, is = {}, cur = {};\n    this.pages.forEach(p => { go[p] = this.nav(p); is[p] = s.page === p; cur[p] = s.page === p ? 'page' : undefined; });\n    const mode = this.props.heroMode ?? 'Foto';\n    const vUrl = this.props.heroVideoUrl ?? '';\n    const heroVideoOn = mode === 'Video' && !!vUrl;\n    const cats = ['Mujer', 'Hombre', 'Niños', 'Sol'];\n    const tagFor = { Mujer: 'tag tag-accent', Hombre: 'tag tag-neutral', 'Niños': 'tag tag-accent-2', Sol: 'tag tag-outline' };\n    const all = [];\n    cats.forEach(c => { for (let i = 1; i <= 4; i++) all.push({ id: c.toLowerCase().replace('ñ', 'n') + '-' + i, cat: c, label: 'Modelo 0' + i, tag: tagFor[c] }); });\n    const faqData = [\n      ['¿Necesito receta para comprar lentes?', 'Para lentes ópticos y de contacto sí necesitas una receta vigente de un profesional de la salud visual. Para lentes de sol sin graduación no es necesaria. Si tienes dudas, escríbenos y te orientamos.'],\n      ['¿Cuánto demoran mis lentes?', 'Depende del tipo de cristal y de los tratamientos que elijas. Al cotizar te indicamos un plazo estimado para tu caso.'],\n      ['¿Qué diferencia hay entre monofocal y multifocal?', 'El monofocal corrige una sola distancia (lejos o cerca). El multifocal o progresivo integra varias distancias en el mismo cristal, para que no tengas que cambiar de lentes.'],\n      ['¿Puedo usar mi propia montura?', 'Sí, en muchos casos. Necesitamos revisarla para confirmar que esté en buen estado y sea compatible con los cristales que necesitas.'],\n      ['¿Tienen convenios?', 'Sí, trabajamos con empresas e instituciones. Escríbenos desde la sección Convenios y te contamos cómo funciona.']\n    ];\n    const sent = s.sent;\n    let waSent = '';\n    if (sent) {\n      const lines = ['Hola Óptica Kronos, quiero cotizar mis lentes.', `Nombre: ${sent.nombre}`, `Teléfono: ${sent.telefono}`];\n      if (sent.correo) lines.push(`Correo: ${sent.correo}`);\n      if (sent.comuna) lines.push(`Comuna: ${sent.comuna}`);\n      lines.push(`Necesito: ${sent.necesidad}`);\n      if (sent.mensaje) lines.push(`Mensaje: ${sent.mensaje}`);\n      if (s.file) lines.push('Tengo una foto de mi receta para enviarles.');\n      waSent = this.wa(lines.join('\\n'));\n    }\n    return {\n      go, is, cur,\n      desktop: !s.mobile, mobile: s.mobile, menuOpen: s.menu, menuClosed: !s.menu, mobileMenu: s.mobile && s.menu,\n      toggleMenu: () => this.setState(st => ({ menu: !st.menu })),\n      goConvenio: this.nav('contacto', { preset: 'Convenio empresa', sent: null }),\n      preset: s.preset,\n      waHref: this.wa('Hola Óptica Kronos, quiero cotizar mis lentes.'),\n      waReceta: this.wa('Hola Óptica Kronos, les envío mi receta para cotizar lentes.'),\n      waFotos: this.wa('Hola Óptica Kronos, ¿me pueden enviar fotos de monturas?'),\n      waDisplay: this.props.whatsapp ?? '+56 9 4508 0845',\n      showWa: this.props.showWhatsapp ?? true,\n      heroVideoOn, heroPhotoOn: !heroVideoOn,\n      heroPlaceholder: mode === 'Video' ? 'Video de portada: pega la URL en Ajustes (o arrastra una foto)' : 'Foto: persona usando lentes',\n      heroVideo: heroVideoOn ? React.createElement('video', { key: vUrl, src: vUrl, autoPlay: true, muted: true, loop: true, playsInline: true, style: { width: '100%', height: '100%', objectFit: 'cover', display: 'block' } }) : null,\n      filters: ['Todas', ...cats].map(c => ({ label: c, cls: c === s.filter ? 'btn btn-primary' : 'btn btn-secondary', pick: () => this.setState({ filter: c }) })),\n      frames: s.filter === 'Todas' ? all : all.filter(m => m.cat === s.filter),\n      faqs: faqData.map(([q, a], i) => ({ q, a, open: s.faq === i, rot: s.faq === i ? 'rotate(180deg)' : 'none', toggle: () => this.setState(st => ({ faq: st.faq === i ? -1 : i })) })),\n      notSent: !sent, isSent: !!sent,\n      sentName: sent ? (sent.nombre.split(' ')[0] || sent.nombre) : '',\n      waSent,\n      fileLabel: s.file || 'Adjunta una foto de tu receta',\n      onFile: (e) => { const f = e.target.files && e.target.files[0]; this.setState({ file: f ? f.name : '' }); },\n      onSubmit: (e) => {\n        e.preventDefault();\n        const fd = new FormData(e.target);\n        const d = {};\n        ['nombre', 'telefono', 'correo', 'comuna', 'necesidad', 'mensaje'].forEach(k => { d[k] = String(fd.get(k) || '').trim(); });\n        this.setState({ sent: d });\n        window.scrollTo(0, 0);\n      },\n      resetForm: () => this.setState({ sent: null, file: '', preset: 'Lentes ópticos' })\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
